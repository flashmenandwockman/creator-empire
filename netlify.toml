# Netlify-Konfiguration für den Creator-Empire-Prototyp.
# Site in Netlify aus diesem Repo anlegen, Base directory leer lassen.
[build]
  command = "bash prototype/build.sh"
  publish = "prototype/dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
